services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Taipei
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../service.sql:/docker-entrypoint-initdb.d/001-service.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: eg-service-backend:local
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SA_TOKEN_JWT_SECRET: ${SA_TOKEN_JWT_SECRET}
      JAVA_OPTS: ${JAVA_OPTS}
      LOG_PATH: /app/logs
    ports:
      - "${BACKEND_PORT:-12345}:12345"
    volumes:
      - backend-logs:/app/logs
      - backend-uploads:/app/dev/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        APP_BASE_URL: ${VITE_BASE_URL:-/}
        APP_API_URL: ${VITE_API_URL:-/}
        APP_LOCK_SALT: ${VITE_LOCK_ENCRYPT_KEY}
    image: eg-service-frontend:local
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3006}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  backend-logs:
  backend-uploads:
